name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      DEPLOY_PATH: ~/studentbar-pos-deploy
      ENV_PRODUCTION_FILE: ${{ secrets.ENV_PRODUCTION_FILE }}
      DOCKER_COMPOSE_FILE: docker-compose.prod.yaml
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://klassiraha.zapto.org

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Copy deployment files to server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$DOCKER_COMPOSE_FILE" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
          scp -i ~/.ssh/id_rsa -r -o StrictHostKeyChecking=yes \
            nginx/ "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SERVER_IP" << EOF
          set -e

          mkdir -p $DEPLOY_PATH
          cd $DEPLOY_PATH

          # Write .env file from secret
          printf '%s\n' "$ENV_PRODUCTION_FILE" > .env
          echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" >> .env

          # Pull latest images from Docker Hub
          docker compose -f $DOCKER_COMPOSE_FILE pull

          # Stop existing containers
          docker compose -f $DOCKER_COMPOSE_FILE down

          # Start with new images
          docker compose -f $DOCKER_COMPOSE_FILE up -d

          echo "Deployment complete!"
          docker compose -f $DOCKER_COMPOSE_FILE ps
          EOF
